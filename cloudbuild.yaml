steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Build project React/Vite
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      # Mengambil URL Backend dari variabel trigger
      - 'VITE_API_URL=$_VITE_API_URL'

  # 3. Deploy ke App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'gcloud app deploy app.yaml --project=$PROJECT_ID --quiet'

# Mengatasi error log bucket
options:
  logging: CLOUD_LOGGING_ONLY