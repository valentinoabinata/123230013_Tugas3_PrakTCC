steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: 'frontend'

  # 2. Build project React/Vite
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'frontend'
    env:
      # Mengambil URL Backend dari variabel trigger
      - 'VITE_API_URL=$_VITE_API_URL'

  # 3. Deploy ke App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'gcloud app deploy app.yaml --project=$PROJECT_ID --quiet'
    dir: 'frontend'

# Tambahkan bagian ini untuk mengatasi error log
options:
  logging: CLOUD_LOGGING_ONLY